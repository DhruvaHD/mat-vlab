<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" id="rockwell-tester-svg">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="rCastGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rSteelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="rDialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="rWeightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rSpecimenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="rShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .interactive-part {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .interactive-part:hover {
      filter: drop-shadow(0 0 10px #0284c7);
      stroke: #38bdf8 !important;
      stroke-width: 2.5px !important;
    }
    .interactive-part.active-part {
      filter: drop-shadow(0 0 14px #10b981);
      stroke: #10b981 !important;
      stroke-width: 3.5px !important;
    }
    .label-badge {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
    }
  </style>

  <!-- Baseplate Bed -->
  <rect x="150" y="705" width="480" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#rShadow)"/>
  <rect x="180" y="695" width="420" height="15" fill="#334155"/>

  <!-- ======================================================= -->
  <!-- 1. MACHINE FRAME (C-Frame Body) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="frame" id="part-frame">
    <path d="M 230 695 
             L 230 190 
             Q 230 130 290 130 
             L 480 130 
             Q 540 130 540 190 
             L 540 330 
             Q 540 370 500 370 
             L 370 370 
             L 370 540 
             L 490 540 
             Q 520 540 520 570 
             L 520 695 Z" 
          fill="url(#rCastGrad)" stroke="#1e293b" stroke-width="3" filter="url(#rShadow)"/>
    <!-- Recessed Casting Cavity -->
    <path d="M 260 675 L 260 210 Q 260 170 300 170 L 470 170 Q 500 170 500 210 L 500 320 Q 500 340 480 340 L 340 340 L 340 570 L 480 570 Q 490 570 490 590 L 490 675 Z" 
          fill="#1e293b" opacity="0.4"/>
    <text x="280" y="270" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" opacity="0.4" transform="rotate(-90 280 270)">MAT-VLAB ROCKWELL</text>
  </g>

  <!-- ======================================================= -->
  <!-- 2. DIRECT-READING DUAL HARDNESS DIAL (HRB / HRC) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="dial-display" id="part-dial-display">
    <!-- Dial Enclosure Housing on Upper Arm -->
    <circle cx="435" cy="235" r="75" fill="#0f172a" stroke="#475569" stroke-width="3" filter="url(#rShadow)"/>
    <circle cx="435" cy="235" r="68" fill="url(#rDialGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Outer Black Scale (HRC - Scale C: Diamond Cone, 150 kgf) -->
    <circle cx="435" cy="235" r="58" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="2, 4"/>
    <!-- Inner Red Scale (HRB - Scale B: 1/16" Ball, 100 kgf) -->
    <circle cx="435" cy="235" r="48" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2, 4"/>
    
    <!-- Dial Zero / SET Point Markings -->
    <text x="435" y="195" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#dc2626">SET (0)</text>
    <text x="435" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#0f172a">100 C</text>
    <text x="435" y="222" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#dc2626">130 B</text>
    
    <text x="480" y="240" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0f172a">50</text>
    <text x="390" y="240" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0f172a">50</text>
    
    <!-- ASTM Standard Text -->
    <text x="435" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#64748b">ASTM E18</text>
    <text x="435" y="280" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#0284c7">1 div = 0.002 mm</text>
    
    <!-- Dual Pointer Needles -->
    <!-- Small Revolutions Counter Pointer -->
    <line x1="435" y1="248" x2="435" y2="240" stroke="#0284c7" stroke-width="2"/>
    <circle cx="435" cy="248" r="3" fill="#0284c7"/>
    <!-- Main Indicator Needle pointing to ~60 HRC -->
    <line x1="435" y1="235" x2="475" y2="215" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="435" cy="235" r="5" fill="#0f172a"/>
  </g>

  <!-- ======================================================= -->
  <!-- 3. INDENTER CHUCK & BRALE DIAMOND CONE / BALL -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="indenter" id="part-indenter">
    <!-- Vertical Depth-Sensing Spindle (Sleeve) -->
    <rect x="420" y="350" width="30" height="50" fill="url(#rSteelGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Indenter Chuck Collet with Knurled Thumb-Screw -->
    <path d="M 423 400 L 447 400 L 442 425 L 428 425 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="452" cy="410" r="5" fill="#94a3b8" stroke="#334155"/>
    <!-- Diamond Brale Spheroconical Indenter (120° Apex Cone) -->
    <path d="M 432 425 L 438 425 L 435 440 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1" filter="url(#rShadow)"/>
    <!-- Indenter Apex Tip Highlight -->
    <circle cx="435" cy="441" r="1.5" fill="#ffffff"/>
    
    <!-- Indenter Specification Callout -->
    <line x1="470" y1="432" x2="445" y2="432" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="475" y="420" width="80" height="22" rx="3" fill="#0284c7"/>
    <text x="515" y="435" class="label-badge" text-anchor="middle">Diamond 120°</text>
  </g>

  <!-- ======================================================= -->
  <!-- 4. TEST SPECIMEN (Hardened / Engineering Alloy) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="specimen" id="part-specimen">
    <rect x="375" y="442" width="120" height="40" rx="3" fill="url(#rSpecimenGrad)" stroke="#78350f" stroke-width="2" filter="url(#rShadow)"/>
    <rect x="378" y="444" width="114" height="6" fill="#fde68a" opacity="0.6"/>
    <!-- Micro-Indentation Depression on Surface -->
    <path d="M 433 442 L 435 445 L 437 442 Z" fill="#78350f"/>
    <text x="435" y="468" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">METAL SPECIMEN</text>
  </g>

  <!-- ======================================================= -->
  <!-- 5. ANVIL (Specimen Support Table) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="anvil" id="part-anvil">
    <!-- Interchangeable Flat Anvil Platen -->
    <rect x="365" y="482" width="140" height="20" rx="4" fill="url(#rSteelGrad)" stroke="#1e293b" stroke-width="2" filter="url(#rShadow)"/>
    <path d="M 395 502 L 475 502 L 465 525 L 405 525 Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- ======================================================= -->
  <!-- 6. ELEVATING SCREW & PRECISION HANDWHEEL -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="elevating-screw" id="part-elevating-screw">
    <!-- Telescoping Elevating Screw Column -->
    <g>
      <rect x="420" y="525" width="30" height="145" fill="url(#rSteelGrad)" stroke="#334155" stroke-width="1.5"/>
      <line x1="420" y1="540" x2="450" y2="543" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="555" x2="450" y2="558" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="570" x2="450" y2="573" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="585" x2="450" y2="588" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="600" x2="450" y2="603" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="615" x2="450" y2="618" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="630" x2="450" y2="633" stroke="#64748b" stroke-width="2"/>
      <line x1="420" y1="645" x2="450" y2="648" stroke="#64748b" stroke-width="2"/>
    </g>
    <!-- Capstan Elevating Handwheel (Large Diameter for Smooth Minor Load Application) -->
    <g id="r-handwheel">
      <ellipse cx="435" cy="590" rx="95" ry="18" fill="url(#rSteelGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#rShadow)"/>
      <ellipse cx="435" cy="590" rx="76" ry="12" fill="#1e293b"/>
      <!-- Spokes & Grip -->
      <line x1="360" y1="590" x2="420" y2="590" stroke="url(#rSteelGrad)" stroke-width="6"/>
      <line x1="450" y1="590" x2="510" y2="590" stroke="url(#rSteelGrad)" stroke-width="6"/>
      <rect x="508" y="565" width="10" height="28" rx="3" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- 7. DASHPOT CONTROLLER & MAJOR LOAD WEIGHT STACK -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="dashpot-lever" id="part-dashpot-lever">
    <!-- Rear Internal Lever Extension -->
    <path d="M 230 180 L 150 180 L 150 250" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <!-- Hydraulic Oil Dashpot (Controls descent speed to prevent shock) -->
    <rect x="130" y="240" width="40" height="70" rx="4" fill="url(#rSteelGrad)" stroke="#1e293b" stroke-width="2" filter="url(#rShadow)"/>
    <line x1="150" y1="210" x2="150" y2="240" stroke="#334155" stroke-width="4"/>
    <text x="150" y="280" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#334155">DASHPOT</text>
    
    <!-- Major Load Weight Stack (Rear) -->
    <!-- Weight 1: 60 kg (HRA) -->
    <rect x="110" y="340" width="80" height="24" rx="3" fill="url(#rWeightGrad)" stroke="#0f172a" stroke-width="1.5" filter="url(#rShadow)"/>
    <text x="150" y="356" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff">60 kgf (HRA)</text>
    <!-- Weight 2: +40 kg -> 100 kg (HRB) -->
    <rect x="105" y="366" width="90" height="24" rx="3" fill="url(#rWeightGrad)" stroke="#0f172a" stroke-width="1.5" filter="url(#rShadow)"/>
    <text x="150" y="382" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff">+40 kg = 100 kgf (HRB)</text>
    <!-- Weight 3: +50 kg -> 150 kg (HRC) -->
    <rect x="100" y="392" width="100" height="26" rx="3" fill="url(#rWeightGrad)" stroke="#0f172a" stroke-width="1.5" filter="url(#rShadow)"/>
    <text x="150" y="409" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff">+50 kg = 150 kgf (HRC)</text>
    <line x1="150" y1="310" x2="150" y2="430" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- ======================================================= -->
  <!-- 8. LOAD APPLICATION & RELEASE OPERATING LEVER -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="operating-lever" id="part-operating-lever">
    <!-- Right Pivot Mount -->
    <circle cx="530" cy="360" r="10" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <!-- Handle Rod extending forward and upward -->
    <line x1="530" y1="360" x2="620" y2="300" stroke="url(#rSteelGrad)" stroke-width="6" stroke-linecap="round" filter="url(#rShadow)"/>
    <!-- Ergonomic Ball Grip -->
    <circle cx="620" cy="300" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2" filter="url(#rShadow)"/>
    <circle cx="616" cy="296" r="4" fill="#ffffff" opacity="0.6"/>
    
    <!-- Operational Arrow (Forward = Apply, Back = Release) -->
    <path d="M 640 280 Q 660 300 645 330" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3, 3"/>
    <text x="660" y="305" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#dc2626">Load / Release</text>
  </g>

  <!-- Interactive Instruction Callout Overlay -->
  <g transform="translate(240, 755)">
    <rect x="0" y="0" width="320" height="32" rx="16" fill="#1e293b" opacity="0.95" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="8" fill="#0284c7"/>
    <text x="18" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">i</text>
    <text x="36" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Tap any machine component to inspect details</text>
  </g>
</svg>
