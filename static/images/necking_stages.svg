<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <linearGradient id="metalBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <marker id="forceArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#0284c7"/>
    </marker>
  </defs>

  <style>
    .stage-title { font-family: 'Poppins', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f2b48; }
    .stage-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
    .force-line { stroke: #0284c7; stroke-width: 2; }
  </style>

  <rect width="1000" height="340" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ================= STAGE 1: ELASTIC ================= -->
  <g transform="translate(40, 30)">
    <text x="70" y="20" text-anchor="middle" class="stage-title">1. Elastic Deformation</text>
    <text x="70" y="38" text-anchor="middle" class="stage-desc">Hooke's Law (σ = Eε)</text>

    <!-- Specimen -->
    <rect x="52" y="70" width="36" height="150" fill="url(#metalBar)" rx="2" stroke="#1e293b"/>

    <!-- Force Arrows -->
    <line x1="70" y1="65" x2="70" y2="45" class="force-line" marker-end="url(#forceArrow)"/>
    <line x1="70" y1="225" x2="70" y2="245" class="force-line" marker-end="url(#forceArrow)"/>

    <text x="70" y="270" text-anchor="middle" font-family="'Inter', system-ui" font-size="11" font-weight="600" fill="#0284c7">Reversible strain</text>
    <text x="70" y="285" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">L = L₀ + ΔL_el</text>
  </g>

  <!-- ================= STAGE 2: UNIFORM PLASTIC ================= -->
  <g transform="translate(230, 30)">
    <text x="70" y="20" text-anchor="middle" class="stage-title">2. Uniform Plastic</text>
    <text x="70" y="38" text-anchor="middle" class="stage-desc">Strain Hardening</text>

    <!-- Specimen: slightly longer, uniformly thinner -->
    <rect x="54" y="65" width="32" height="160" fill="url(#metalBar)" rx="2" stroke="#1e293b"/>

    <!-- Dislocation lines indication -->
    <line x1="56" y1="120" x2="84" y2="120" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="56" y1="140" x2="84" y2="140" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="56" y1="160" x2="84" y2="160" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Force Arrows -->
    <line x1="70" y1="60" x2="70" y2="35" class="force-line" marker-end="url(#forceArrow)"/>
    <line x1="70" y1="230" x2="70" y2="255" class="force-line" marker-end="url(#forceArrow)"/>

    <text x="70" y="270" text-anchor="middle" font-family="'Inter', system-ui" font-size="11" font-weight="600" fill="#d97706">Permanent strain</text>
    <text x="70" y="285" text-anchor="middle" font-family="'Inter', system-ui" font-size="10" fill="#475569">Uniform area reduction</text>
  </g>

  <!-- ================= STAGE 3: NECKING ONSET ================= -->
  <g transform="translate(420, 30)">
    <text x="70" y="20" text-anchor="middle" class="stage-title">3. Necking Onset (UTS)</text>
    <text x="70" y="38" text-anchor="middle" class="stage-desc">Plastic Instability</text>

    <!-- Specimen with necking -->
    <path d="
      M 54 60
      L 86 60
      L 86 125
      Q 86 145 78 145
      Q 86 145 86 165
      L 86 230
      L 54 230
      L 54 165
      Q 54 145 62 145
      Q 54 145 54 125
      Z"
      fill="url(#metalBar)" stroke="#1e293b"/>

    <!-- Highlight neck area -->
    <ellipse cx="70" cy="145" rx="8" ry="4" fill="#dc2626" opacity="0.4"/>

    <!-- Force Arrows -->
    <line x1="70" y1="55" x2="70" y2="30" class="force-line" marker-end="url(#forceArrow)"/>
    <line x1="70" y1="235" x2="70" y2="260" class="force-line" marker-end="url(#forceArrow)"/>

    <text x="70" y="270" text-anchor="middle" font-family="'Inter', system-ui" font-size="11" font-weight="700" fill="#dc2626">Maximum Load (F_max)</text>
    <text x="70" y="285" text-anchor="middle" font-family="'Inter', system-ui" font-size="10" fill="#475569">Local neck forms</text>
  </g>

  <!-- ================= STAGE 4: VOID NUCLEATION ================= -->
  <g transform="translate(610, 30)">
    <text x="70" y="20" text-anchor="middle" class="stage-title">4. Void Coalescence</text>
    <text x="70" y="38" text-anchor="middle" class="stage-desc">Internal Micro-cracking</text>

    <!-- Severely necked specimen -->
    <path d="
      M 54 55
      L 86 55
      L 86 120
      Q 86 145 75 145
      Q 86 145 86 170
      L 86 235
      L 54 235
      L 54 170
      Q 54 145 65 145
      Q 54 145 54 120
      Z"
      fill="url(#metalBar)" stroke="#1e293b"/>

    <!-- Internal voids -->
    <circle cx="68" cy="145" r="2" fill="#dc2626"/>
    <circle cx="72" cy="144" r="1.5" fill="#dc2626"/>
    <circle cx="70" cy="147" r="1.8" fill="#dc2626"/>

    <!-- Force Arrows -->
    <line x1="70" y1="50" x2="70" y2="25" class="force-line" marker-end="url(#forceArrow)"/>
    <line x1="70" y1="240" x2="70" y2="265" class="force-line" marker-end="url(#forceArrow)"/>

    <text x="70" y="270" text-anchor="middle" font-family="'Inter', system-ui" font-size="11" font-weight="600" fill="#b91c1c">Triaxial stress core</text>
    <text x="70" y="285" text-anchor="middle" font-family="'Inter', system-ui" font-size="10" fill="#475569">Central void growth</text>
  </g>

  <!-- ================= STAGE 5: CUP AND CONE FRACTURE ================= -->
  <g transform="translate(800, 30)">
    <text x="70" y="20" text-anchor="middle" class="stage-title">5. Cup &amp; Cone Fracture</text>
    <text x="70" y="38" text-anchor="middle" class="stage-desc">Final Shear Separation</text>

    <!-- Top fractured piece (Cup) -->
    <path d="
      M 54 50
      L 86 50
      L 86 115
      Q 86 135 76 135
      L 73 138
      L 67 138
      L 64 135
      Q 54 135 54 115
      Z"
      fill="url(#metalBar)" stroke="#1e293b"/>

    <!-- 45 deg shear lips marker top -->
    <line x1="64" y1="135" x2="67" y2="138" stroke="#dc2626" stroke-width="2"/>
    <line x1="76" y1="135" x2="73" y2="138" stroke="#dc2626" stroke-width="2"/>

    <!-- Bottom fractured piece (Cone) -->
    <path d="
      M 64 148
      L 68 145
      L 72 145
      L 76 148
      Q 86 155 86 175
      L 86 240
      L 54 240
      L 54 175
      Q 54 155 64 148
      Z"
      fill="url(#metalBar)" stroke="#1e293b"/>

    <!-- Cone tip -->
    <line x1="64" y1="148" x2="68" y2="145" stroke="#dc2626" stroke-width="2"/>
    <line x1="76" y1="148" x2="72" y2="145" stroke="#dc2626" stroke-width="2"/>

    <text x="70" y="270" text-anchor="middle" font-family="'Inter', system-ui" font-size="11" font-weight="700" fill="#059669">Ductile Rupture</text>
    <text x="70" y="285" text-anchor="middle" font-family="'Inter', system-ui" font-size="10" fill="#475569">45° shear lip edges</text>
  </g>
</svg>
