<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#edf4fa" rx="16" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Background Laboratory Grid -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.6">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Atomic Lattice (FCC unit cell isometric projection) -->
  <g transform="translate(60, 60)" opacity="0.95">
    <!-- Lattice cube back edges -->
    <line x1="60" y1="30" x2="140" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="140" y1="30" x2="140" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="60" y1="30" x2="20" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Lattice cube front edges -->
    <rect x="20" y="70" width="80" height="80" fill="none" stroke="#2b6cb0" stroke-width="2"/>
    <line x1="100" y1="70" x2="140" y2="30" stroke="#2b6cb0" stroke-width="2"/>
    <line x1="100" y1="150" x2="140" y2="110" stroke="#2b6cb0" stroke-width="2"/>
    <line x1="20" y1="70" x2="60" y2="30" stroke="#2b6cb0" stroke-width="2"/>
    <line x1="60" y1="30" x2="140" y2="30" stroke="#2b6cb0" stroke-width="2"/>

    <!-- Corner Atoms -->
    <circle cx="20" cy="70" r="6" fill="#0284c7"/>
    <circle cx="100" cy="70" r="6" fill="#0284c7"/>
    <circle cx="20" cy="150" r="6" fill="#0284c7"/>
    <circle cx="100" cy="150" r="6" fill="#0284c7"/>
    <circle cx="60" cy="30" r="5" fill="#2b6cb0"/>
    <circle cx="140" cy="30" r="5" fill="#2b6cb0"/>
    <circle cx="140" cy="110" r="5" fill="#2b6cb0"/>

    <!-- Face Centered Atom -->
    <circle cx="60" cy="110" r="8" fill="#d97706"/>
    <text x="60" y="180" text-anchor="middle" font-family="'Poppins', system-ui" font-size="10" font-weight="700" fill="#0f2b48">CRYSTALLINE METALLIC LATTICE</text>
  </g>

  <!-- Central Stress-Strain Oscilloscope Card -->
  <g transform="translate(240, 50)">
    <rect width="320" height="230" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>
    <rect x="15" y="15" width="290" height="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>

    <!-- Graph axes -->
    <line x1="30" y1="150" x2="290" y2="150" stroke="#64748b" stroke-width="1.5"/>
    <line x1="30" y1="150" x2="30" y2="25" stroke="#64748b" stroke-width="1.5"/>
    <text x="290" y="160" text-anchor="end" font-family="'Inter', system-ui" font-size="9" font-weight="600" fill="#475569">Strain (ε)</text>
    <text x="25" y="25" text-anchor="start" font-family="'Inter', system-ui" font-size="9" font-weight="600" fill="#475569">Stress (σ)</text>

    <!-- Stress Strain Path -->
    <path d="
      M 30 150
      L 70 80
      L 75 88
      L 95 88
      Q 170 35 210 40
      Q 245 45 265 95"
      fill="none" stroke="url(#glowGrad)" stroke-width="3"/>

    <!-- Key Points -->
    <circle cx="70" cy="80" r="4" fill="#d97706"/>
    <circle cx="210" cy="40" r="5" fill="#dc2626"/>
    <text x="210" y="28" text-anchor="middle" font-family="'Poppins', system-ui" font-size="9" font-weight="700" fill="#dc2626">UTS</text>
    <circle cx="265" cy="95" r="4" fill="#059669"/>

    <!-- Readout Card Footer -->
    <rect x="15" y="175" width="85" height="40" fill="#f1f5f9" stroke="#e2e8f0" rx="4"/>
    <text x="22" y="190" font-family="'Inter', system-ui" font-size="8" font-weight="700" fill="#475569">MODULUS</text>
    <text x="22" y="206" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0284c7">205 GPa</text>

    <rect x="115" y="175" width="85" height="40" fill="#f1f5f9" stroke="#e2e8f0" rx="4"/>
    <text x="122" y="190" font-family="'Inter', system-ui" font-size="8" font-weight="700" fill="#475569">YIELD (σ_y)</text>
    <text x="122" y="206" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#d97706">250 MPa</text>

    <rect x="215" y="175" width="90" height="40" fill="#f1f5f9" stroke="#e2e8f0" rx="4"/>
    <text x="222" y="190" font-family="'Inter', system-ui" font-size="8" font-weight="700" fill="#475569">UTS (σ_max)</text>
    <text x="222" y="206" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#dc2626">440 MPa</text>
  </g>

  <!-- Bottom Instrument Console Bar -->
  <g transform="translate(40, 310)">
    <rect width="520" height="110" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="8"/>
    <circle cx="30" cy="35" r="8" fill="#059669"/>
    <text x="50" y="39" font-family="'Poppins', system-ui" font-size="13" font-weight="700" fill="#0f2b48">UNIVERSAL TESTING MACHINE — TELEMETRY READY</text>

    <text x="30" y="68" font-family="'Inter', system-ui" font-size="11" font-weight="500" fill="#475569">ASTM E8 Uniaxial Tensile | Dual Extensometer 100 Hz | High-Precision Load Cell Sensor</text>

    <!-- Badges -->
    <rect x="30" y="82" width="115" height="20" fill="#0f2b48" rx="3"/>
    <text x="87" y="96" text-anchor="middle" font-family="'Inter', system-ui" font-size="9" font-weight="700" fill="#ffffff">SIMULATION MODE</text>

    <rect x="155" y="82" width="130" height="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="3"/>
    <text x="220" y="96" text-anchor="middle" font-family="'Inter', system-ui" font-size="9" font-weight="700" fill="#0369a1">REAL LAB MANUAL DATA</text>

    <rect x="295" y="82" width="120" height="20" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="3"/>
    <text x="355" y="96" text-anchor="middle" font-family="'Inter', system-ui" font-size="9" font-weight="700" fill="#047857">PDF REPORT EXPORT</text>
  </g>
</svg>
