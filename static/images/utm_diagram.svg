<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" id="utm-svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="screwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="specimenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .interactive-part {
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .interactive-part:hover {
      filter: drop-shadow(0px 0px 8px #0284c7);
      stroke: #0284c7 !important;
      stroke-width: 2.5px !important;
    }
    .interactive-part.active-part {
      filter: drop-shadow(0px 0px 10px #059669);
      stroke: #059669 !important;
      stroke-width: 3px !important;
    }
    .grid-line {
      stroke: #e2e8f0;
      stroke-dasharray: 4,4;
      stroke-width: 1;
    }
    .label-text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #1e293b;
    }
  </style>

  <!-- Background Laboratory Grid -->
  <rect width="800" height="900" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>
  <g opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="900" class="grid-line"/>
    <line x1="200" y1="0" x2="200" y2="900" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="900" class="grid-line"/>
    <line x1="400" y1="0" x2="400" y2="900" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="900" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="900" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="900" class="grid-line"/>
    <line x1="0" y1="150" x2="800" y2="150" class="grid-line"/>
    <line x1="0" y1="300" x2="800" y2="300" class="grid-line"/>
    <line x1="0" y1="450" x2="800" y2="450" class="grid-line"/>
    <line x1="0" y1="600" x2="800" y2="600" class="grid-line"/>
    <line x1="0" y1="750" x2="800" y2="750" class="grid-line"/>
  </g>

  <!-- BASE CABINET / WORKBENCH -->
  <rect x="180" y="710" width="440" height="150" fill="url(#frameGrad)" stroke="#1e293b" stroke-width="2" rx="6"/>
  <rect x="200" y="730" width="400" height="110" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="4"/>
  <!-- Base ventilation & brand badge -->
  <line x1="220" y1="750" x2="320" y2="750" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="765" x2="320" y2="765" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="780" x2="320" y2="780" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="360" y="745" width="220" height="80" fill="#1e293b" rx="4" stroke="#0284c7" stroke-width="1.5"/>
  <text x="470" y="775" text-anchor="middle" font-family="'Poppins', system-ui" font-size="14" font-weight="700" fill="#38bdf8">MAT-VLAB UTM 50kN</text>
  <text x="470" y="795" text-anchor="middle" font-family="'Inter', system-ui" font-size="10" font-weight="600" fill="#cbd5e1">ELECTROMECHANICAL TESTING SYSTEM</text>
  <circle cx="560" cy="808" r="4" fill="#10b981" filter="url(#glow)"/>

  <!-- TWIN BALL-SCREW COLUMNS (INTERACTIVE) -->
  <g id="part-lead-screws" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <!-- Left column -->
    <rect x="230" y="140" width="30" height="570" fill="url(#screwGrad)" stroke="#94a3b8" stroke-width="1" rx="2"/>
    <!-- Thread notches left -->
    <line x1="230" y1="200" x2="260" y2="195" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="250" x2="260" y2="245" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="300" x2="260" y2="295" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="350" x2="260" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="400" x2="260" y2="395" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="450" x2="260" y2="445" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="500" x2="260" y2="495" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="550" x2="260" y2="545" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="600" x2="260" y2="595" stroke="#64748b" stroke-width="1.5"/>
    <line x1="230" y1="650" x2="260" y2="645" stroke="#64748b" stroke-width="1.5"/>

    <!-- Right column -->
    <rect x="540" y="140" width="30" height="570" fill="url(#screwGrad)" stroke="#94a3b8" stroke-width="1" rx="2"/>
    <!-- Thread notches right -->
    <line x1="540" y1="200" x2="570" y2="195" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="250" x2="570" y2="245" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="300" x2="570" y2="295" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="350" x2="570" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="400" x2="570" y2="395" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="450" x2="570" y2="445" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="500" x2="570" y2="495" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="550" x2="570" y2="545" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="600" x2="570" y2="595" stroke="#64748b" stroke-width="1.5"/>
    <line x1="540" y1="650" x2="570" y2="645" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- UPPER FIXED CROSSBEAM -->
  <rect x="200" y="90" width="400" height="50" fill="url(#frameGrad)" stroke="#1e293b" stroke-width="2" rx="4"/>

  <!-- MOVABLE CROSSHEAD (INTERACTIVE) -->
  <g id="part-crosshead" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <rect x="210" y="240" width="380" height="55" fill="url(#metalGrad)" stroke="#0284c7" stroke-width="2" rx="4"/>
    <circle cx="245" cy="267" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="555" cy="267" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <text x="400" y="273" text-anchor="middle" font-family="'Poppins', system-ui" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">MOVABLE CROSSHEAD</text>
  </g>

  <!-- LOAD CELL (INTERACTIVE) -->
  <g id="part-load-cell" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <rect x="365" y="295" width="70" height="45" fill="url(#sensorGrad)" stroke="#059669" stroke-width="1.5" rx="3"/>
    <line x1="375" y1="318" x2="425" y2="318" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="400" cy="318" r="5" fill="#ffffff"/>
    <text x="400" y="310" text-anchor="middle" font-family="'Inter', system-ui" font-size="8" font-weight="700" fill="#ffffff">LOAD CELL</text>
    <text x="400" y="333" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#d1fae5">50 kN</text>
  </g>

  <!-- UPPER HYDRAULIC WEDGE GRIP (INTERACTIVE) -->
  <g id="part-upper-grip" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <path d="M 370 340 L 430 340 L 420 395 L 380 395 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="382" y="375" width="36" height="25" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <!-- Serrated grip jaws -->
    <line x1="388" y1="380" x2="395" y2="380" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="388" y1="387" x2="395" y2="387" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="388" y1="394" x2="395" y2="394" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="405" y1="380" x2="412" y2="380" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="405" y1="387" x2="412" y2="387" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="405" y1="394" x2="412" y2="394" stroke="#f1f5f9" stroke-width="1.5"/>
  </g>

  <!-- TENSILE SPECIMEN (DOGBONE) (INTERACTIVE) -->
  <g id="part-specimen" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <!-- Upper Grip Section -->
    <rect x="393" y="390" width="14" height="20" fill="url(#specimenGrad)" rx="1"/>
    <!-- Upper Shoulder / Fillet -->
    <path d="M 393 410 Q 393 425 396 430 L 404 430 Q 407 425 407 410 Z" fill="url(#specimenGrad)"/>
    <!-- Gauge Length (Narrow test section) -->
    <rect id="specimen-gauge-section" x="396" y="430" width="8" height="80" fill="url(#specimenGrad)"/>
    <!-- Necking zone center indicator -->
    <ellipse id="specimen-neck-zone" cx="400" cy="470" rx="4" ry="2" fill="#b45309" opacity="0.6"/>
    <!-- Lower Shoulder / Fillet -->
    <path d="M 396 510 Q 393 515 393 530 L 407 530 Q 407 515 404 510 Z" fill="url(#specimenGrad)"/>
    <!-- Lower Grip Section -->
    <rect x="393" y="530" width="14" height="20" fill="url(#specimenGrad)" rx="1"/>

    <!-- Gauge mark lines (L0 = 50mm boundary) -->
    <line x1="386" y1="435" x2="414" y2="435" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="386" y1="505" x2="414" y2="505" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- EXTENSOMETER (CLIP-ON) (INTERACTIVE) -->
  <g id="part-extensometer" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <rect x="425" y="445" width="35" height="50" fill="#334155" stroke="#1e293b" stroke-width="1" rx="3"/>
    <circle cx="442" cy="470" r="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="442" y1="470" x2="447" y2="466" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Knife-edge attachment arms to specimen -->
    <path d="M 425 450 L 404 438" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 425 490 L 404 502" stroke="#0284c7" stroke-width="1.5"/>
    <text x="442" y="488" text-anchor="middle" font-family="'Inter', system-ui" font-size="7" font-weight="700" fill="#cbd5e1">EXT</text>
  </g>

  <!-- LOWER FIXED WEDGE GRIP (INTERACTIVE) -->
  <g id="part-lower-grip" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <path d="M 380 545 L 420 545 L 430 600 L 370 600 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="382" y="540" width="36" height="25" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <!-- Serrated jaws -->
    <line x1="388" y1="545" x2="395" y2="545" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="388" y1="552" x2="395" y2="552" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="405" y1="545" x2="412" y2="545" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="405" y1="552" x2="412" y2="552" stroke="#f1f5f9" stroke-width="1.5"/>
  </g>

  <!-- LOWER FIXED BED -->
  <rect x="230" y="600" width="340" height="40" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="1.5" rx="3"/>

  <!-- CONTROL PANEL CONSOLE (STANDALONE / ATTACHED) (INTERACTIVE) -->
  <g id="part-control-panel" class="interactive-part" stroke="#0284c7" stroke-width="0">
    <rect x="620" y="320" width="150" height="260" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" rx="8" filter="url(#glow)"/>
    <!-- Screen -->
    <rect x="635" y="340" width="120" height="85" fill="#0f172a" stroke="#0284c7" stroke-width="1" rx="4"/>
    <text x="645" y="360" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22c55e">FORCE:  0.00 kN</text>
    <text x="645" y="378" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">EXT:    0.000 mm</text>
    <text x="645" y="396" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fbbf24">STATUS: READY</text>
    <text x="645" y="414" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">ACQ RATE: 100 Hz</text>

    <!-- Emergency Stop Button -->
    <circle cx="695" cy="460" r="16" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <text x="695" y="464" text-anchor="middle" font-family="'Poppins', system-ui" font-size="9" font-weight="800" fill="#ffffff">E-STOP</text>

    <!-- Control Buttons -->
    <rect x="640" y="495" width="45" height="25" fill="#059669" rx="4"/>
    <text x="662" y="511" text-anchor="middle" font-family="'Inter', system-ui" font-size="9" font-weight="700" fill="#ffffff">START</text>

    <rect x="705" y="495" width="45" height="25" fill="#64748b" rx="4"/>
    <text x="727" y="511" text-anchor="middle" font-family="'Inter', system-ui" font-size="9" font-weight="700" fill="#ffffff">STOP</text>

    <!-- Jog buttons -->
    <rect x="640" y="535" width="45" height="20" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="3"/>
    <text x="662" y="549" text-anchor="middle" font-family="'Inter', system-ui" font-size="8" font-weight="700" fill="#334155">▲ JOG</text>

    <rect x="705" y="535" width="45" height="20" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="3"/>
    <text x="727" y="549" text-anchor="middle" font-family="'Inter', system-ui" font-size="8" font-weight="700" fill="#334155">▼ JOG</text>

    <!-- Connecting umbilical cable to machine -->
    <path d="M 620 480 Q 585 530 570 650" fill="none" stroke="#2b6cb0" stroke-width="2.5" stroke-dasharray="4,4"/>
  </g>

  <!-- POINTER CALLOUT LABELS & GUIDELINES (HIGH-CONTRAST DARK TEXT) -->
  <g>
    <!-- Load Cell callout -->
    <line x1="365" y1="315" x2="160" y2="315" stroke="#2b6cb0" stroke-width="1.5"/>
    <circle cx="160" cy="315" r="3.5" fill="#2b6cb0"/>
    <text x="150" y="319" text-anchor="end" class="label-text">Load Cell (50 kN)</text>

    <!-- Upper Grip callout -->
    <line x1="375" y1="365" x2="160" y2="365" stroke="#2b6cb0" stroke-width="1.5"/>
    <circle cx="160" cy="365" r="3.5" fill="#2b6cb0"/>
    <text x="150" y="369" text-anchor="end" class="label-text">Upper Hydraulic Grip</text>

    <!-- Specimen callout -->
    <line x1="408" y1="470" x2="520" y2="470" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="520" cy="470" r="3.5" fill="#d97706"/>
    <text x="530" y="474" text-anchor="start" class="label-text" fill="#b45309">Tensile Specimen (Gauge: 50mm)</text>

    <!-- Extensometer callout -->
    <line x1="460" y1="455" x2="550" y2="420" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="550" cy="420" r="3.5" fill="#0284c7"/>
    <text x="560" y="424" text-anchor="start" class="label-text" fill="#0284c7">Clip-on Extensometer</text>

    <!-- Lower Grip callout -->
    <line x1="375" y1="575" x2="160" y2="575" stroke="#2b6cb0" stroke-width="1.5"/>
    <circle cx="160" cy="575" r="3.5" fill="#2b6cb0"/>
    <text x="150" y="579" text-anchor="end" class="label-text">Lower Fixed Grip</text>

    <!-- Lead screw callout -->
    <line x1="230" y1="210" x2="160" y2="210" stroke="#475569" stroke-width="1.5"/>
    <circle cx="160" cy="210" r="3.5" fill="#475569"/>
    <text x="150" y="214" text-anchor="end" class="label-text" fill="#475569">Twin Ball Lead Screws</text>
  </g>
</svg>
