<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="100%" height="100%" id="rockwell-stages-svg">
  <defs>
    <linearGradient id="rsSpecimen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rsDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background Specimen Block -->
  <rect x="30" y="140" width="690" height="150" rx="4" fill="url(#rsSpecimen)" stroke="#0f172a" stroke-width="2"/>
  <line x1="30" y1="140" x2="720" y2="140" stroke="#94a3b8" stroke-width="2"/>

  <!-- ================= STAGE 1: MINOR LOAD (F0 = 10 kgf) ================= -->
  <g transform="translate(130, 0)">
    <text x="0" y="30" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#0284c7">STAGE 1</text>
    <text x="0" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#dc2626">Minor Load F₀ = 10 kgf</text>
    
    <!-- Load Arrow -->
    <line x1="0" y1="58" x2="0" y2="90" stroke="#dc2626" stroke-width="3"/>
    <polygon points="-5,85 0,95 5,85" fill="#dc2626"/>

    <!-- Indenter Cone (Shallow seating depth h0) -->
    <polygon points="-25,95 25,95 0,152" fill="url(#rsDiamond)" stroke="#0369a1" stroke-width="1.5"/>
    
    <!-- Datum line & dial zero -->
    <line x1="-50" y1="152" x2="50" y2="152" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Datum h₀ (SET 0)</text>
    <text x="0" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Seats into surface; dial zeroed</text>
  </g>

  <!-- Divider 1 -->
  <line x1="260" y1="20" x2="260" y2="280" stroke="#475569" stroke-dasharray="4,4"/>

  <!-- ================= STAGE 2: MAJOR LOAD (F0 + F1) ================= -->
  <g transform="translate(375, 0)">
    <text x="0" y="30" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#f59e0b">STAGE 2</text>
    <text x="0" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#dc2626">Major Load (F₀ + F₁ = 150 kgf)</text>
    
    <!-- Large Load Arrow -->
    <line x1="0" y1="58" x2="0" y2="82" stroke="#dc2626" stroke-width="6"/>
    <polygon points="-8,78 0,90 8,78" fill="#dc2626"/>

    <!-- Indenter Cone (Deep penetration h1) -->
    <polygon points="-25,90 25,90 0,195" fill="url(#rsDiamond)" stroke="#0369a1" stroke-width="1.5"/>
    
    <!-- Max depth line -->
    <line x1="-50" y1="195" x2="50" y2="195" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="225" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Max Depth h₁</text>
    <text x="0" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Elastic + Plastic Penetration</text>
  </g>

  <!-- Divider 2 -->
  <line x1="490" y1="20" x2="490" y2="280" stroke="#475569" stroke-dasharray="4,4"/>

  <!-- ================= STAGE 3: UNLOADING TO F0 (RECOVERY & MEASUREMENT) ================= -->
  <g transform="translate(615, 0)">
    <text x="0" y="30" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#10b981">STAGE 3</text>
    <text x="0" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#10b981">Release Major Load (Keep F₀)</text>
    
    <!-- Minor Load Arrow -->
    <line x1="0" y1="58" x2="0" y2="90" stroke="#dc2626" stroke-width="3"/>
    <polygon points="-5,85 0,95 5,85" fill="#dc2626"/>

    <!-- Indenter Cone (Elastic recovery to h2) -->
    <polygon points="-25,95 25,95 0,175" fill="url(#rsDiamond)" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Net Permanent Depth Dimension e -->
    <line x1="-45" y1="152" x2="-45" y2="175" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="-49,158 -45,152 -41,158" fill="#10b981"/>
    <polygon points="-49,169 -45,175 -41,169" fill="#10b981"/>
    <text x="-52" y="167" text-anchor="end" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#10b981">e</text>
    
    <text x="0" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#10b981">Permanent Depth e = h₂ - h₀</text>
    <text x="0" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">HR = N - (e / 0.002 mm)</text>
  </g>
</svg>
