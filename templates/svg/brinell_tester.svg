<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" id="brinell-tester-svg">
  <defs>
    <!-- Metallic & Component Gradients -->
    <linearGradient id="bCastIronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bSteelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bSpecimenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bDialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bScopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .interactive-part {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .interactive-part:hover {
      filter: drop-shadow(0 0 10px #0284c7);
      stroke: #38bdf8 !important;
      stroke-width: 2.5px !important;
    }
    .interactive-part.active-part {
      filter: drop-shadow(0 0 14px #10b981);
      stroke: #10b981 !important;
      stroke-width: 3.5px !important;
    }
    .label-badge {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #ffffff;
    }
  </style>

  <!-- Background Baseplate -->
  <rect x="140" y="710" width="460" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#bShadow)"/>
  <rect x="170" y="700" width="400" height="15" fill="#334155"/>

  <!-- ======================================================= -->
  <!-- 1. MACHINE FRAME (C-Frame Heavy Column) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="frame" id="part-frame">
    <!-- Main Rigid C-Frame Body -->
    <path d="M 210 700 
             L 210 180 
             Q 210 120 280 120 
             L 470 120 
             Q 530 120 530 180 
             L 530 290 
             Q 530 330 490 330 
             L 370 330 
             L 370 540 
             L 480 540 
             Q 510 540 510 570 
             L 510 700 Z" 
          fill="url(#bCastIronGrad)" stroke="#1e293b" stroke-width="3" filter="url(#bShadow)"/>
    
    <!-- Cast Iron Decorative Recess / Strengthening Ribs -->
    <path d="M 240 680 L 240 200 Q 240 160 280 160 L 460 160 Q 490 160 490 200 L 490 270 Q 490 290 470 290 L 340 290 L 340 570 L 470 570 Q 480 570 480 590 L 480 680 Z" 
          fill="#1e293b" opacity="0.45"/>
    <text x="260" y="240" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" opacity="0.4" transform="rotate(-90 260 240)">MAT-VLAB BRINELL</text>
  </g>

  <!-- ======================================================= -->
  <!-- 2. LOADING MECHANISM (Hydraulic Cylinder / Deadweight Lever) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="loading-mechanism" id="part-loading-mechanism">
    <!-- Top Hydraulic Pressure Cylinder -->
    <rect x="380" y="70" width="130" height="60" rx="6" fill="url(#bSteelGrad)" stroke="#334155" stroke-width="2" filter="url(#bShadow)"/>
    <rect x="420" y="45" width="50" height="25" fill="#475569" stroke="#1e293b"/>
    <!-- Load Adjustment Capstan Valve -->
    <circle cx="445" cy="45" r="14" fill="url(#bGoldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="425" y1="45" x2="465" y2="45" stroke="#ffffff" stroke-width="2"/>
    <line x1="445" y1="25" x2="445" y2="65" stroke="#ffffff" stroke-width="2"/>
    <!-- Hydraulic Return Hose -->
    <path d="M 510 100 Q 560 100 560 180 T 510 240" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ======================================================= -->
  <!-- 3. DIAL GAUGE (Load Indicator / Pressure Gauge) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="dial-gauge" id="part-dial-gauge">
    <!-- Dial Housing Bracket -->
    <rect x="525" y="165" width="25" height="16" fill="#334155"/>
    <!-- Gauge Outer Bezel -->
    <circle cx="590" cy="170" r="50" fill="#1e293b" stroke="#64748b" stroke-width="3" filter="url(#bShadow)"/>
    <!-- Dial Face -->
    <circle cx="590" cy="170" r="44" fill="url(#bDialGrad)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Scale Ticks -->
    <circle cx="590" cy="170" r="38" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2, 6"/>
    <!-- Dial Markings -->
    <text x="590" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#dc2626">3000 kgf</text>
    <text x="618" y="174" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#475569">1000</text>
    <text x="562" y="174" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#475569">500</text>
    <text x="590" y="196" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#0f172a">ASTM E10</text>
    <!-- Pointer Needle -->
    <line x1="590" y1="170" x2="590" y2="136" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="590" cy="170" r="4" fill="#0f172a"/>
  </g>

  <!-- ======================================================= -->
  <!-- 4. INDENTER CHUCK & TUNGSTEN CARBIDE BALL -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="indenter" id="part-indenter">
    <!-- Vertical Loading Ram Spindle -->
    <rect x="425" y="325" width="40" height="50" fill="url(#bSteelGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Indenter Chuck / Adapter Collar -->
    <path d="M 430 375 L 460 375 L 452 405 L 438 405 Z" fill="url(#bCastIronGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="440" y="405" width="10" height="12" fill="#475569"/>
    <!-- 10mm Tungsten Carbide Spherical Indenter Ball -->
    <circle cx="445" cy="425" r="10" fill="url(#bSteelGrad)" stroke="#0f172a" stroke-width="2" filter="url(#bShadow)"/>
    <circle cx="442" cy="422" r="3" fill="#ffffff" opacity="0.75"/>
    <!-- Ball Diameter Callout Arrow -->
    <line x1="475" y1="425" x2="457" y2="425" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="480" y="415" width="60" height="20" rx="3" fill="#ef4444"/>
    <text x="510" y="429" class="label-badge" text-anchor="middle">D = 10 mm</text>
  </g>

  <!-- ======================================================= -->
  <!-- 5. TEST SPECIMEN (Polished Metal Sample) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="specimen" id="part-specimen">
    <!-- Rectangular Specimen Block -->
    <rect x="385" y="433" width="120" height="42" rx="3" fill="url(#bSpecimenGrad)" stroke="#0369a1" stroke-width="2" filter="url(#bShadow)"/>
    <!-- Top Polished Face Highlight -->
    <rect x="388" y="435" width="114" height="6" fill="#7dd3fc" opacity="0.6"/>
    <!-- Spherical Cap Indentation Impression on Top Surface -->
    <path d="M 440 435 Q 445 442 450 435 Z" fill="#0c4a6e" stroke="#0369a1" stroke-width="1"/>
    <!-- Specimen Material Label -->
    <text x="445" y="460" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">METAL SPECIMEN</text>
  </g>

  <!-- ======================================================= -->
  <!-- 6. ANVIL (Specimen Support Table) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="anvil" id="part-anvil">
    <!-- Anvil Top Platen Platform -->
    <rect x="375" y="475" width="140" height="22" rx="4" fill="url(#bSteelGrad)" stroke="#1e293b" stroke-width="2" filter="url(#bShadow)"/>
    <!-- Anvil Bolster Support Hub -->
    <path d="M 405 497 L 485 497 L 475 520 L 415 520 Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- ======================================================= -->
  <!-- 7. ELEVATING SCREW & HANDWHEEL -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="elevating-screw" id="part-elevating-screw">
    <!-- Threaded Acme Lead Screw -->
    <g>
      <rect x="430" y="520" width="30" height="150" fill="url(#bSteelGrad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Acme Screw Thread Notches -->
      <line x1="430" y1="535" x2="460" y2="538" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="550" x2="460" y2="553" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="565" x2="460" y2="568" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="580" x2="460" y2="583" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="595" x2="460" y2="598" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="610" x2="460" y2="613" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="625" x2="460" y2="628" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="640" x2="460" y2="643" stroke="#475569" stroke-width="2"/>
      <line x1="430" y1="655" x2="460" y2="658" stroke="#475569" stroke-width="2"/>
    </g>
    <!-- Telescoping Elevating Screw Shroud Cylinder -->
    <rect x="420" y="660" width="50" height="40" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <!-- Elevating Handwheel -->
    <g id="handwheel">
      <ellipse cx="445" cy="590" rx="90" ry="18" fill="url(#bSteelGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#bShadow)"/>
      <ellipse cx="445" cy="590" rx="72" ry="12" fill="#1e293b"/>
      <!-- Spokes -->
      <line x1="375" y1="590" x2="430" y2="590" stroke="url(#bSteelGrad)" stroke-width="6"/>
      <line x1="460" y1="590" x2="515" y2="590" stroke="url(#bSteelGrad)" stroke-width="6"/>
      <!-- Rotating Handle Grip -->
      <rect x="515" y="565" width="10" height="28" rx="3" fill="url(#bGoldGrad)" stroke="#78350f" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- 8. BRINELL OPTICAL MEASURING MICROSCOPE (SWING ARM) -->
  <!-- ======================================================= -->
  <g class="interactive-part" data-part="microscope" id="part-microscope">
    <!-- Microscope Swivel Arm / Bracket -->
    <path d="M 370 380 L 300 380 L 300 450 L 260 450" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <circle cx="300" cy="380" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Microscope Main Body Tube (20x) -->
    <g transform="translate(190, 420) rotate(15)">
      <!-- Eyepiece Tube & Micrometer Scale -->
      <rect x="20" y="0" width="30" height="90" rx="4" fill="url(#bScopeGrad)" stroke="#0f172a" stroke-width="2" filter="url(#bShadow)"/>
      <!-- Eyepiece Lens Cup -->
      <path d="M 15 0 L 55 0 L 45 20 L 25 20 Z" fill="#0f172a"/>
      <!-- Micrometer Adjustment Drum -->
      <rect x="15" y="35" width="40" height="20" rx="3" fill="url(#bSteelGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="20" y1="45" x2="50" y2="45" stroke="#334155" stroke-dasharray="2, 2"/>
      <!-- Objective Nose Cone -->
      <path d="M 25 90 L 45 90 L 40 120 L 30 120 Z" fill="#475569" stroke="#0f172a"/>
      <!-- Internal Reticle Illumination LED -->
      <circle cx="35" cy="120" r="4" fill="#38bdf8"/>
    </g>

    <!-- Microscope Reticle Inset Circle -->
    <g transform="translate(80, 520)">
      <circle cx="60" cy="60" r="55" fill="#f8fafc" stroke="#0284c7" stroke-width="3" filter="url(#bShadow)"/>
      <circle cx="60" cy="60" r="50" fill="#f1f5f9"/>
      <!-- Reticle Crosshairs -->
      <line x1="15" y1="60" x2="105" y2="60" stroke="#64748b" stroke-width="1"/>
      <line x1="60" y1="15" x2="60" y2="105" stroke="#64748b" stroke-width="1"/>
      <!-- Calibrated Division Ticks -->
      <line x1="30" y1="56" x2="30" y2="64" stroke="#0f172a" stroke-width="1"/>
      <line x1="45" y1="54" x2="45" y2="66" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="60" y1="50" x2="60" y2="70" stroke="#0f172a" stroke-width="2"/>
      <line x1="75" y1="54" x2="75" y2="66" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="90" y1="56" x2="90" y2="64" stroke="#0f172a" stroke-width="1"/>
      <!-- Indentation Circular Impression Preview -->
      <circle cx="60" cy="60" r="26" fill="#0284c7" opacity="0.3" stroke="#0284c7" stroke-width="2"/>
      <!-- Diameter Dimension Arrows d1 and d2 -->
      <line x1="34" y1="60" x2="86" y2="60" stroke="#dc2626" stroke-width="1.5"/>
      <text x="60" y="45" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#dc2626">d = 5.18 mm</text>
      <text x="60" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0369a1">20x Optical Reticle</text>
    </g>
  </g>

  <!-- Interactive Instruction Callout Overlay -->
  <g transform="translate(240, 755)">
    <rect x="0" y="0" width="320" height="32" rx="16" fill="#1e293b" opacity="0.95" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="8" fill="#0284c7"/>
    <text x="18" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">i</text>
    <text x="36" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Tap any machine component to inspect details</text>
  </g>
</svg>
