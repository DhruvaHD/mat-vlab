<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="auto" class="mat-vlab-svg">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="coolGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="50%" stop-color="#1b6b50"/>
      <stop offset="100%" stop-color="#2e9e76"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="partGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b6b50" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .interactive-part {
      cursor: pointer;
      transition: all 0.25s ease-in-out;
    }
    .interactive-part:hover, .interactive-part:focus {
      filter: drop-shadow(0 0 8px #2e9e76);
      opacity: 0.92;
    }
    .active-part {
      filter: drop-shadow(0 0 12px #10b981) !important;
      stroke: #10b981 !important;
      stroke-width: 2.5px !important;
    }
    .diagram-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #375345;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #0f3d2e;
    }
    .dimension-line {
      stroke: #94a3b8;
      stroke-width: 1;
      stroke-dasharray: 3,3;
    }
  </style>

  <!-- Background Grid & Machine Pedestal -->
  <rect x="0" y="0" width="800" height="650" fill="#f8faf9" rx="8"/>

  <!-- Concrete Cast Floor & Machine Bed Foundation -->
  <rect x="100" y="560" width="600" height="55" rx="4" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <rect x="120" y="580" width="560" height="25" rx="2" fill="#475569"/>
  <!-- Foundation Bolts -->
  <circle cx="160" cy="588" r="6" fill="#94a3b8" stroke="#1e293b"/>
  <circle cx="640" cy="588" r="6" fill="#94a3b8" stroke="#1e293b"/>

  <!-- ==================== 1. SAFETY HOUSING (CONTAINMENT CAGE) ==================== -->
  <g id="part-safety-housing" class="interactive-part" data-part="safety-housing">
    <rect x="130" y="80" width="540" height="480" rx="10" fill="#e8f5ef" fill-opacity="0.35" stroke="#1b6b50" stroke-width="2" stroke-dasharray="8,4"/>
    <!-- Wire Mesh Overlay Pattern -->
    <path d="M 130 140 L 670 140 M 130 200 L 670 200 M 130 260 L 670 260 M 130 320 L 670 320 M 130 380 L 670 380 M 130 440 L 670 440 M 130 500 L 670 500" stroke="#cbd5e1" stroke-width="0.75" stroke-opacity="0.6"/>
    <!-- Interlock Switch Badge -->
    <rect x="635" y="110" width="28" height="40" rx="4" fill="#0f3d2e" stroke="#2e9e76" stroke-width="1.5"/>
    <circle cx="649" cy="125" r="4" fill="#22c55e"/>
    <text x="649" y="142" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="bold">LOCK</text>
  </g>

  <!-- Main Machine Column (Dual A-Frame Uprights) -->
  <polygon points="260,560 310,130 350,130 390,560" fill="url(#frameGrad)" stroke="#0f172a" stroke-width="2"/>
  <polygon points="410,560 450,130 490,130 540,560" fill="url(#frameGrad)" stroke="#0f172a" stroke-width="2"/>
  <!-- Cross Brace -->
  <rect x="330" y="320" width="140" height="24" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Central Pivot Bearing Housing -->
  <circle cx="400" cy="130" r="38" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="3"/>
  <circle cx="400" cy="130" r="22" fill="#0f3d2e" stroke="#2e9e76" stroke-width="2"/>
  <circle cx="400" cy="130" r="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>

  <!-- ==================== 2. DIAL INDICATOR & SCALE ==================== -->
  <g id="part-dial-indicator" class="interactive-part" data-part="dial-indicator">
    <!-- Dial Enclosure Plate -->
    <circle cx="400" cy="130" r="105" fill="#ffffff" stroke="#0f3d2e" stroke-width="3" filter="url(#partGlow)"/>
    <circle cx="400" cy="130" r="96" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Circular Graduations (0 to 300 Joules) -->
    <!-- Arc from 135 deg to -45 deg -->
    <path d="M 333 63 A 95 95 0 1 1 467 63" fill="none" stroke="#1b6b50" stroke-width="5" stroke-linecap="round"/>
    <!-- Calibration Ticks -->
    <line x1="333" y1="63" x2="340" y2="70" stroke="#0f3d2e" stroke-width="2"/>
    <text x="325" y="60" font-size="9" font-weight="bold" fill="#0f3d2e" text-anchor="end">300 J</text>
    <line x1="400" y1="35" x2="400" y2="46" stroke="#0f3d2e" stroke-width="2"/>
    <text x="400" y="30" font-size="9" font-weight="bold" fill="#0f3d2e" text-anchor="middle">150 J</text>
    <line x1="467" y1="63" x2="460" y2="70" stroke="#0f3d2e" stroke-width="2"/>
    <text x="475" y="60" font-size="9" font-weight="bold" fill="#0f3d2e" text-anchor="start">0 J</text>

    <!-- Dial Follower Pointer & Active Friction Pointer -->
    <line x1="400" y1="130" x2="365" y2="52" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="365" cy="52" r="3.5" fill="#dc2626"/>
    <!-- Friction drag pointer (marks max absorbed energy) -->
    <line x1="400" y1="130" x2="425" y2="40" stroke="#1b6b50" stroke-width="2" stroke-dasharray="3,1"/>
    <circle cx="400" cy="130" r="6" fill="#1e293b"/>
  </g>

  <!-- ==================== 3. RELEASE LATCH & SOLENOID ==================== -->
  <g id="part-release-latch" class="interactive-part" data-part="release-latch">
    <!-- Latched at ~140 degrees position -->
    <rect x="200" y="115" width="55" height="32" rx="4" fill="url(#coolGreenGrad)" stroke="#0f3d2e" stroke-width="2"/>
    <polygon points="255,123 275,131 255,139" fill="url(#brassGrad)" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="215" cy="131" r="5" fill="#22c55e"/>
    <text x="232" y="135" font-size="8" fill="#ffffff" font-weight="bold">TRIGGER</text>
    <path d="M 200 131 L 175 131 L 175 180" fill="none" stroke="#2e9e76" stroke-width="2"/>
    <!-- Manual Release Lever -->
    <rect x="168" y="180" width="14" height="30" rx="3" fill="#dc2626"/>
  </g>

  <!-- Pendulum Swing Arc Track (dashed guideline) -->
  <path d="M 235 245 A 250 250 0 0 0 400 480 A 250 250 0 0 0 575 295" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ==================== 4. PENDULUM ARM ==================== -->
  <g id="part-pendulum-arm" class="interactive-part" data-part="pendulum-arm">
    <!-- Rendered in dynamic swinging position (~25 deg from vertical toward striking point) -->
    <!-- Heavy structural steel arm -->
    <polygon points="394,140 406,140 404,440 396,440" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="2"/>
    <!-- Ribbed stiffening web -->
    <line x1="400" y1="160" x2="400" y2="430" stroke="#64748b" stroke-width="3"/>
    <!-- Effective radius dimension line R = 750 mm -->
    <line x1="420" y1="140" x2="420" y2="460" stroke="#1b6b50" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="428" y="300" font-size="9" fill="#0f3d2e" font-weight="bold">R = 750 mm</text>
  </g>

  <!-- ==================== 5. STRIKER HAMMER (TUP) ==================== -->
  <g id="part-striker-hammer" class="interactive-part" data-part="striker-hammer">
    <!-- Heavy cast pendulum hammer body -->
    <path d="M 370 435 L 430 435 L 440 495 L 360 495 Z" fill="url(#frameGrad)" stroke="#0f172a" stroke-width="2" filter="url(#partGlow)"/>
    <!-- Interchangeable Striking Knife Edge (Tup) -->
    <!-- ASTM E23: 8 mm radius striking edge (or ISO 2mm radius) -->
    <polygon points="400,470 425,482 400,494" fill="url(#brassGrad)" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="425" cy="482" r="3.5" fill="#fef08a" stroke="#ca8a04"/>
    <!-- Hammer Center of Percussion (COP) Indicator -->
    <circle cx="400" cy="475" r="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <line x1="400" y1="465" x2="400" y2="485" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="390" y1="475" x2="410" y2="475" stroke="#22c55e" stroke-width="1.5"/>
    <text x="350" y="478" font-size="8" fill="#ffffff" font-weight="bold">COP</text>
  </g>

  <!-- ==================== 6. SPECIMEN ANVIL & SUPPORTS ==================== -->
  <g id="part-specimen-anvil" class="interactive-part" data-part="specimen-anvil">
    <!-- Heavy Cast Base Reaction Block -->
    <rect x="330" y="500" width="140" height="60" rx="4" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <!-- Hardened Left Support Anvil (ISO/ASTM R1.0 mm anvil shoulder) -->
    <rect x="350" y="475" width="22" height="30" rx="2" fill="url(#metalGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M 372 475 Q 374 477 372 485" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <!-- Hardened Right Support Anvil -->
    <rect x="428" y="475" width="22" height="30" rx="2" fill="url(#metalGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M 428 475 Q 426 477 428 485" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <!-- 40 mm Span Dimension -->
    <line x1="372" y1="515" x2="428" y2="515" stroke="#2e9e76" stroke-width="1.5"/>
    <line x1="372" y1="510" x2="372" y2="520" stroke="#2e9e76" stroke-width="1.5"/>
    <line x1="428" y1="510" x2="428" y2="520" stroke="#2e9e76" stroke-width="1.5"/>
    <text x="400" y="528" font-size="8" fill="#1b6b50" font-weight="bold" text-anchor="middle">40.0 mm SPAN</text>
  </g>

  <!-- ==================== 7. CHARPY SPECIMEN ==================== -->
  <g id="part-charpy-specimen" class="interactive-part" data-part="charpy-specimen">
    <!-- Specimen resting horizontally across anvils (10x10x55 mm) -->
    <rect x="358" y="474" width="84" height="15" rx="1" fill="url(#coolGreenGrad)" stroke="#0f3d2e" stroke-width="1.5"/>
    <!-- 45-degree V-Notch (2 mm deep, pointing AWAY from striker) -->
    <polygon points="400,489 397,483 403,483" fill="#ffffff" stroke="#0f3d2e" stroke-width="1"/>
    <!-- Center Strike Direction Arrow -->
    <polygon points="400,466 396,458 404,458" fill="#e11d48"/>
    <!-- Specimen Label Tag -->
    <rect x="375" y="456" width="50" height="14" rx="2" fill="#ffffff" stroke="#1b6b50" stroke-width="1"/>
    <text x="400" y="466" font-size="7.5" fill="#0f3d2e" font-weight="bold" text-anchor="middle">CHARPY V</text>
  </g>

  <!-- ==================== 8. BRAKE MECHANISM ==================== -->
  <g id="part-brake-mechanism" class="interactive-part" data-part="brake-mechanism">
    <!-- Pendulum Safety Brake Lever & Drum -->
    <circle cx="475" cy="180" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <rect x="470" y="180" width="10" height="75" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" transform="rotate(-20, 475, 180)"/>
    <circle cx="505" cy="255" r="8" fill="#1e293b"/>
    <text x="520" y="260" font-size="9" fill="#991b1b" font-weight="bold">BRAKE</text>
  </g>

  <!-- Header & Standard Reference Callout in Diagram -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="280" height="48" rx="6" fill="#ffffff" stroke="#d6e5dc" stroke-width="1.5" filter="url(#partGlow)"/>
    <text x="12" y="20" class="title-text">CHARPY &amp; IZOD IMPACT TESTER</text>
    <text x="12" y="38" font-size="10" fill="#1b6b50" font-weight="600">Standard: ASTM E23 / ISO 148-1 | 300 Joules Capacity</text>
  </g>

  <!-- Interactive Hint Banner -->
  <g transform="translate(510, 35)">
    <rect x="0" y="0" width="250" height="40" rx="20" fill="#e8f5ef" stroke="#2e9e76" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="12" fill="#1b6b50"/>
    <text x="22" y="24" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">i</text>
    <text x="44" y="24" font-size="9.5" fill="#0f3d2e" font-weight="600">Click or tap any labeled part to inspect</text>
  </g>
</svg>
