<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%" id="brinell-indent-svg">
  <defs>
    <linearGradient id="biBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="biSpecimen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Specimen Cross Section -->
  <path d="M 50 180 L 230 180 Q 325 250 420 180 L 600 180 L 600 320 L 50 320 Z" fill="url(#biSpecimen)" stroke="#0369a1" stroke-width="2"/>
  <rect x="50" y="180" width="550" height="6" fill="#7dd3fc" opacity="0.4"/>

  <!-- Spherical Indenter Ball (D = 10 mm) pressing in -->
  <circle cx="325" cy="115" r="95" fill="url(#biBall)" stroke="#1e293b" stroke-width="3" opacity="0.95"/>
  <circle cx="300" cy="85" r="22" fill="#ffffff" opacity="0.5"/>

  <!-- Force Vector Arrow -->
  <line x1="325" y1="10" x2="325" y2="70" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <polygon points="315,65 325,85 335,65" fill="#dc2626"/>
  <text x="340" y="45" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#dc2626">Load P (kgf)</text>

  <!-- Ball Diameter Dimension D -->
  <line x1="230" y1="115" x2="420" y2="115" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="230" y1="105" x2="230" y2="125" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="105" x2="420" y2="125" stroke="#475569" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1e293b">Ball Diameter (D)</text>

  <!-- Indentation Diameter Dimension d -->
  <line x1="240" y1="180" x2="410" y2="180" stroke="#dc2626" stroke-width="2"/>
  <polygon points="245,176 235,180 245,184" fill="#dc2626"/>
  <polygon points="405,176 415,180 405,184" fill="#dc2626"/>
  <text x="325" y="200" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#dc2626">Indentation Diameter (d)</text>

  <!-- Indentation Depth Dimension h -->
  <line x1="425" y1="180" x2="465" y2="180" stroke="#059669" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="425" y1="210" x2="465" y2="210" stroke="#059669" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="455" y1="180" x2="455" y2="210" stroke="#059669" stroke-width="2"/>
  <text x="470" y="200" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#059669">Depth (h)</text>

  <!-- Minimum Thickness Bracket t >= 8h -->
  <line x1="570" y1="180" x2="570" y2="320" stroke="#ffffff" stroke-width="2"/>
  <polygon points="566,188 570,180 574,188" fill="#ffffff"/>
  <polygon points="566,312 570,320 574,312" fill="#ffffff"/>
  <text x="560" y="255" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Min. Thickness t ≥ 8h</text>
</svg>
